name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  # ---------- CI: compile + run all tests ----------
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and run tests
        # Testcontainers starts a real PostgreSQL in Docker (available on ubuntu runners)
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/

  # ---------- Containerize + smoke test the full stack ----------
  docker-smoke-test:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start app + database
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Hit the API
        run: |
          curl -fsS http://localhost:8080/actuator/health
          curl -fsS -X POST http://localhost:8080/api/v1/borrowers \
            -H "Content-Type: application/json" \
            -d '{"name":"CI User","email":"ci@test.com"}'
          curl -fsS -X POST http://localhost:8080/api/v1/books \
            -H "Content-Type: application/json" \
            -d '{"isbn":"9780132350884","title":"Clean Code","author":"Robert C. Martin"}'
          curl -fsS http://localhost:8080/api/v1/books

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ---------- CD: publish image to GitHub Container Registry ----------
  publish-image:
    name: Publish Docker image
    runs-on: ubuntu-latest
    needs: docker-smoke-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
